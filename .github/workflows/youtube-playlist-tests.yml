name: YouTube Playlist Tests

on:
  pull_request:
    paths:
      - 'scripts/sync-youtube-playlist*'
      - '.github/workflows/youtube-playlist-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/sync-youtube-playlist*'
      - '.github/workflows/youtube-playlist-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/sync-youtube-playlist.test.mjs
